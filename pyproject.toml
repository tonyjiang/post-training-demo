[project]
name = "post-training-demo"
version = "0.1.0"
description = "Olmo 3 Think 7B post-training experiments on the gaming server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.15.0",
    "bitsandbytes==0.50.2",
    "liger-kernel==0.8.5",
    "numpy==2.5.4",
    "peft==0.21.2",
    "pyarrow>=26.0.0",
    "torch==2.14.0",
    "transformers==5.20.2",
]

[tool.uv]
package = false
# The validated CUDA training environment is Linux x86_64, not the local Mac.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
rlvr = [
    "trl==1.17.1",
    "antlr4-python3-runtime==4.11.1",
]
dpo = [
    "trl==1.17.1",
]
eval = [
    "emoji>=2.16.0",
    "immutabledict>=4.3.1",
    "langdetect>=1.0.9",
    "nltk>=3.9,<4",
    "spacy>=3.8,<4",
    "syllapy>=0.8.0",
]
